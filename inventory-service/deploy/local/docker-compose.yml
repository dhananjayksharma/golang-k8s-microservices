services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: order_user, POSTGRES_PASSWORD: order_password, POSTGRES_DB: order_db}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"], interval: 5s, timeout: 3s, retries: 20}
  mysql:
    image: mysql:8.4
    environment: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: appdb}
    ports: ["3306:3306"]
    healthcheck: {test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"], interval: 5s, timeout: 3s, retries: 30}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment: {RABBITMQ_DEFAULT_USER: admin, RABBITMQ_DEFAULT_PASS: admin}
    ports: ["5672:5672", "15672:15672"]
