openapi: 3.1.0
info:
  title: Shared Service Response Contract
  version: 2.0.0
  description: Canonical response envelope used by order-service and inventory-service.
components:
  schemas:
    ResponseKind:
      type: string
      enum: [standard, error, verify_source]
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
    VerifySource:
      type: object
      required: [source, verified]
      properties:
        source: { type: string }
        verified: { type: boolean }
        reason: { type: string }
    Meta:
      type: object
      properties:
        request_id: { type: string }
        limit: { type: integer, minimum: 0 }
        offset: { type: integer, minimum: 0 }
        count: { type: integer, minimum: 0 }
    Response:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: '#/components/schemas/ResponseKind'
        data: {}
        error:
          $ref: '#/components/schemas/Error'
        verify_source:
          $ref: '#/components/schemas/VerifySource'
        meta:
          $ref: '#/components/schemas/Meta'
      oneOf:
        - properties:
            kind: { const: standard }
          required: [data]
        - properties:
            kind: { const: error }
          required: [error]
        - properties:
            kind: { const: verify_source }
          required: [verify_source]
